[env:xiao_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LORA_SCK=4
    -D LORA_MISO=5
    -D LORA_MOSI=6
    -D LORA_CS=7
    -D LORA_BUSY=3
    -D LORA_DIO1=2
    -D LORA_RST=1
    -D USE_SX1262=1 
    -D LORA_FREQ=868.0
